<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara | Your Mental Wellness Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* A few custom styles for a calming, focused UI */
        html, body { height: 100%; overflow: hidden; background-color: #f3f4f6; }
        #chat-container { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; background-color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        #messages { flex-grow: 1; overflow-y: auto; padding: 1.5rem; }
       .chat-bubble { max-width: 80%; }
    </style>
</head>
<body>
    <div id="chat-container">
        <header class="p-4 border-b bg-base-200">
            <h1 class="text-xl font-bold text-center">Sahara</h1>
            <p class="text-sm text-center text-gray-500">Your AI companion for mental wellness</p>
        </header>

        <main id="messages">
            <div class="chat chat-start">
                <div class="chat-image avatar">
                    <div class="w-10 rounded-full bg-primary text-primary-content"><span>AI</span></div>
                </div>
                <div class="chat-bubble chat-bubble-primary">Hello! I'm Sahara, your AI companion. I'm here to listen and support you in a safe, non-judgmental space. How are you feeling today?</div>
            </div>
        </main>

        <footer class="p-4 border-t bg-base-200">
            <form id="chat-form" class="flex gap-2">
                <input id="message-input" type="text" placeholder="Type your message..." class="input input-bordered w-full" autocomplete="off" />
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </footer>
    </div>
<script>
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const messagesContainer = document.getElementById('messages');
    
    // --- FIX: Robust session ID handling ---
    let sessionId = localStorage.getItem('sahara_session_id');
    // Check for null, undefined, or the literal string "undefined"
    if (!sessionId || sessionId === 'undefined') {
        sessionId = crypto.randomUUID();
        localStorage.setItem('sahara_session_id', sessionId);
    }
    // --- END FIX ---

    // --- IMPORTANT: This should be your backend URL ---
    const BACKEND_URL = 'https://sahara-backend-239891597349.asia-south1.run.app';

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageText = messageInput.value.trim();
        if (messageText === '') return;

        appendMessage(messageText, 'user');
        messageInput.value = '';
        appendTypingIndicator();

        try {
            const response = await fetch(`${BACKEND_URL}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText, sessionId: sessionId }),
            });

            removeTypingIndicator();

            if (!response.ok) throw new Error('Network response was not ok.');

            const data = await response.json();
            sessionId = data.session_id; // Update session ID from the (now correct) backend response
            localStorage.setItem('sahara_session_id', sessionId);

            appendMessage(data.reply, 'bot', data.isCrisis);

        } catch (error) {
            console.error('Error:', error);
            removeTypingIndicator();
            appendMessage("I'm sorry, something went wrong. Please try again.", 'bot', true);
        }
    });

    function appendMessage(text, sender, isCrisis = false) {
        const messageWrapper = document.createElement('div');
        messageWrapper.classList.add('chat', sender === 'user'? 'chat-end' : 'chat-start');
        
        const bubbleColor = sender === 'bot'? (isCrisis? 'chat-bubble-error' : 'chat-bubble-primary') : 'chat-bubble-accent';
        const avatarHTML = sender === 'bot'? `<div class="chat-image avatar"><div class="w-10 rounded-full bg-primary text-primary-content"><span>AI</span></div></div>` : '';

        const messageText = text || "Sorry, I couldn't get a response.";
        messageWrapper.innerHTML = `${avatarHTML}<div class="chat-bubble ${bubbleColor}">${messageText.replace(/\n/g, '<br>')}</div>`;
        messagesContainer.appendChild(messageWrapper);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendTypingIndicator() {
        const typingIndicator = document.createElement('div');
        typingIndicator.id = 'typing-indicator';
        typingIndicator.classList.add('chat', 'chat-start');
        typingIndicator.innerHTML = `<div class="chat-image avatar"><div class="w-10 rounded-full bg-primary text-primary-content"><span>AI</span></div></div><div class="chat-bubble chat-bubble-primary"><span class="loading loading-dots loading-md"></span></div>`;
        messagesContainer.appendChild(typingIndicator);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function removeTypingIndicator() {
        const typingIndicator = document.getElementById('typing-indicator');
        if (typingIndicator) typingIndicator.remove();
    }
</script>
</body>
</html>
